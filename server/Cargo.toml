[package]
name = "space-race-server"
version = "0.1.18"
edition = "2024"
license = "Unlicense"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
space-race-logger.workspace = true
space-race-protocol.workspace = true
space-race-sim.workspace = true
ron.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.29.0"
