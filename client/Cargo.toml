[package]
name = "space-race-client"
version = "0.1.18"
edition = "2024"
license = "Unlicense"

[dependencies]
anyhow.workspace = true
bevy = "0.19.1"
space-race-protocol.workspace = true
space-race-sim.workspace = true
futures-util = "0.3.34"
getrandom.workspace = true
ron.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tokio-tungstenite-wasm = "0.9.0"

# Native: command line, identity file in the user data directory, networking thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
tokio = { workspace = true, features = ["rt"] }

# Web: settings from the page address, identity in local storage, networking on the page's event
# loop. Bevy's `web` feature makes its clock and task pool use browser APIs; without it, the game
# builds but panics as soon as it reads the time.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", features = ["web"] }
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "Location",
    "MediaQueryList",
    "Storage",
    "UrlSearchParams",
    "Window",
] }
