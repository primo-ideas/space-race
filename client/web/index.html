<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- A phone must not zoom, scroll or bounce the page: every touch belongs to the game, and the
       canvas fills the screen notch to notch. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Space Race</title>
  <!-- The site has one icon, at its root, which every page under it shares: the games do not
       each carry a mark of their own. -->
  <link rel="icon" href="/favicon.png">
  <style>
    /* The game canvas fills the page (Window::fit_canvas_to_parent). */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; outline: none; }
    /* A finger on the game steers it; it never scrolls, zooms, selects or flashes a tap
       highlight. `touch-action: none` is what makes a thumb sliding across the cross reach the
       game as one gesture instead of being taken for a scroll. */
    body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* The game is played in landscape: both thumbs need a bottom corner of their own, and the
       track is drawn wide. This is plain CSS, so it stands there while the module is still
       loading. */
    #turn { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #turn {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #07090d;
        color: #eef2f8;
        font: 800 27px/1.15 system-ui, sans-serif;
        letter-spacing: 1px;
        text-align: center;
      }
      #turn span { font: 400 15px/1.4 system-ui, sans-serif; color: #2fb8ff; }
    }
  </style>
</head>
<body>
  <div id="turn">TURN YOUR PHONE<span>Space Race is played in landscape.</span></div>
  <script type="module">
    import init from "./space-race-client.js";

    init().catch((error) => {
      // winit leaves its event loop by throwing this on purpose: not a failure.
      if (!String(error).includes("Using exceptions for control flow")) {
        throw error;
      }
    });
  </script>
</body>
</html>
