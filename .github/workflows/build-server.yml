# The game server compiles. It pulls no Bevy, so this is the quick one.
name: Build server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Debug info is the expensive half of a dev build and CI only needs to know the code compiles
  # (see docs/architecture.md#build-profiles).
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Each workflow caches under a key of its own: naming a single crate changes the feature
      # unification, so two workflows sharing a target directory would fight over it
      # (see docs/architecture.md#feature-unification).
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-server-

      - run: cargo build --locked -p space-race-server --all-targets

      # Saved even when the step above failed: actions/cache writes only on success,
      # and a red build is exactly when the next run should not start from nothing.
      # Skipped on an exact hit, since that key already holds this Cargo.lock.
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-server-${{ hashFiles('**/Cargo.lock') }}
