# The client compiles for the browser. The server cannot: only the client crate is named here,
# and the wasm target keeps a cache of its own (see docs/web.md).
name: Build client (wasm)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: rustup target add wasm32-unknown-unknown

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-client-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-client-wasm-

      # The dev profile, like every other check here. The release module is built by "Deploy",
      # which is the build that has to work for real.
      - run: cargo build --locked -p space-race-client --target wasm32-unknown-unknown

      # Saved even when the step above failed: actions/cache writes only on success,
      # and a red build is exactly when the next run should not start from nothing.
      # Skipped on an exact hit, since that key already holds this Cargo.lock.
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-client-wasm-${{ hashFiles('**/Cargo.lock') }}
