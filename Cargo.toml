[workspace]
resolver = "3"
members = ["client", "logger", "protocol", "server", "sim"]

[workspace.dependencies]
anyhow = "1.0.104"
bitcode = { version = "0.6.9", features = ["glam"] }
star-racer-logger = { path = "logger" }
star-racer-protocol = { path = "protocol" }
star-racer-sim = { path = "sim" }
getrandom = "0.4.3"
# Must stay the version Bevy uses, so `Vec2` is the same type on the client. The pin lives here
# and nowhere else: four crates now speak this type, and a second pin is a mismatch waiting to
# happen (see docs/architecture.md#workspace-layout).
glam = { version = "0.32.1", default-features = false, features = ["std"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Bevy recommends optimizing dependencies even in debug builds,
# otherwise the game is unplayable during development.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The web build: the module is downloaded before anything can be played, so it is built for size
# first. One codegen unit and link-time optimization across every crate let the compiler drop
# what is never called and merge what is the same; "s" rather than "z", which is smaller
# again but stops unrolling and vectorizing loops the renderer runs every frame; no symbols,
# and a panic aborts, which is all a browser tab can do with one. See docs/web.md#size.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
